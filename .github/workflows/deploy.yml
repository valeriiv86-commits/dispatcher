# Живой деплой: каждый push в main -> тесты -> обновление сервера по SSH.
# Нужные секреты репозитория (Settings -> Secrets and variables -> Actions):
#   SSH_HOST, SSH_USER, SSH_KEY (приватный ключ), опционально SSH_PORT, APP_DIR
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: cd backend && python -m pytest -q
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - id: check
        env: { SSH_HOST: "${{ secrets.SSH_HOST }}" }
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "::warning::Секреты SSH не заданы — деплой пропущен"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: bash "${{ secrets.APP_DIR || '/opt/dispatcher' }}/deploy/deploy.sh"
